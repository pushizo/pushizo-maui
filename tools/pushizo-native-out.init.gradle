// Yerel Android derlemesinin (sdk/maui/native/android; sdk/android/pushizo kaynaktan dahil edilir) çıktılarını
// çağıranın verdiği klasöre yönlendirir; sdk/android ve sdk/maui/native altına build çıktısı yazılmaz.
// Kullanım: gradle -p sdk/maui/native/android -I pushizo-native-out.init.gradle -PpushizoOutDir=<klasör> \
//           :pushizo:assembleRelease :pushizo-maui-bridge:assembleRelease
def outRoot = gradle.startParameter.projectProperties['pushizoOutDir']
if (outRoot == null || outRoot.trim().isEmpty()) {
    throw new GradleException('pushizoOutDir özelliği gerekli (-PpushizoOutDir=<klasör>).')
}
allprojects { p ->
    p.layout.buildDirectory.set(new File(outRoot, p.name == rootProject.name ? 'root' : p.name))
}
